name: Oracle Uptime Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping oracle - status, freshness, x402 rail
        env:
          NTFY_TOPIC: undsr-oracle-watch-4441
        shell: bash
        run: |
          set +e
          FAIL=""

          RESP=$(curl -sS --max-time 25 --retry 2 -w "\n%{http_code}" https://oracle.the-undesirables.com/health)
          CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          [ "$CODE" != "200" ] && FAIL="/health HTTP $CODE"

          if [ -z "$FAIL" ]; then
            STATUS=$(printf '%s' "$BODY" | jq -r '.status // "missing"')
            LD=$(printf '%s' "$BODY" | jq -r '.latest_date // ""')
            if [ "$STATUS" != "ok" ]; then
              FAIL="status=$STATUS"
            elif [ -n "$LD" ]; then
              AGE=$(( ( $(date -u +%s) - $(date -u -d "$LD" +%s) ) / 86400 ))
              # Only alarm if the oracle CLAIMS to be refreshing. When an upstream
              # feed is down the root publishes panels.usd.refreshing=false, and a
              # stale date is then the correct, known state rather than an outage.
              # Without this the monitor fired every 2h for days over the 2026-09
              # USD freeze -- and an alert that always fires is an alert nobody
              # reads, which is worse than no alert at all.
              REFRESHING=$(curl -sS --max-time 25 https://oracle.the-undesirables.com/ \
                           | jq -r '.panels.usd.refreshing | tostring')
              # NOTE: do NOT write `// "unknown"` here. jq's // fires on false as
              # well as null, so it would turn the very value we need (false)
              # into "unknown" and the guard would never match. tostring is exact.
              if [ "$REFRESHING" = "false" ]; then
                echo "note: USD panel is a KNOWN freeze (latest_date=$LD, ${AGE}d) - not alarming"
              elif [ "$AGE" -gt 2 ]; then
                FAIL="pipeline stale: latest_date=$LD (${AGE}d old)"
              fi
            fi
          fi

          if [ -z "$FAIL" ]; then
            # 2026-09-12: /api/v1/market is SUSPENDED (200, not charged) while the USD panel
            # is frozen, so it can no longer prove the rail. Probe a paid route that is
            # live — graded-slab loan terms — and read the manifest if that ever changes.
            RAIL=$(curl -sS --max-time 25 -o /dev/null -w "%{http_code}" "https://oracle.the-undesirables.com/api/v1/loan-terms?product_id=1&grade=PSA+10&term_days=30")
            [ "$RAIL" != "402" ] && FAIL="x402 rail: /api/v1/loan-terms -> $RAIL (want 402)"
          fi

          if [ -n "$FAIL" ]; then
            curl -sS -H "Title: Undesirables Oracle ALERT" -H "Priority: urgent" -H "Tags: rotating_light" \
              -d "Oracle check FAILED: $FAIL ($(date -u '+%F %H:%M UTC'))" \
              "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
            echo "::error::$FAIL"
            exit 1
          fi
          echo "oracle healthy: status=$STATUS latest_date=$LD rail=402"

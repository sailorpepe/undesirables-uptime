name: Oracle Uptime Monitor

# Runs on GitHub's always-on infra (NOT the Mini/Studio) so it can catch
# the oracle being down even when both of David's machines are off/asleep.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min
  workflow_dispatch: {}        # manual "Run workflow" button for testing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping oracle · verify status, freshness, and x402 rail
        env:
          NTFY_TOPIC: undsr-oracle-watch-4441
        run: |
          set +e
          FAIL=""

          # 1) oracle up + status ok
          RESP=$(curl -sS --max-time 25 --retry 2 -w $'\n%{http_code}' https://oracle.the-undesirables.com/health)
          CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" != "200" ]; then FAIL="/health returned HTTP $CODE"; fi

          # 2) status==ok + pipeline not >2 days stale
          if [ -z "$FAIL" ]; then
            MSG=$(python3 - "$BODY" <<'PY'
import sys, json, datetime
try:
    d = json.loads(sys.argv[1])
except Exception as e:
    print(f"/health body not JSON: {e}"); raise SystemExit
if d.get("status") != "ok":
    print(f"status = {d.get('status')!r}"); raise SystemExit
ld = d.get("latest_date")
try:
    days = (datetime.date.today() - datetime.date.fromisoformat(ld)).days
    if days > 2:
        print(f"pipeline stale: latest_date={ld} ({days} days old)")
except Exception as e:
    print(f"unparseable latest_date {ld!r}: {e}")
PY
)
            [ -n "$MSG" ] && FAIL="$MSG"
          fi

          # 3) x402 rail + gating alive (a paid GET must 402, not 200/5xx)
          if [ -z "$FAIL" ]; then
            RAIL=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://oracle.the-undesirables.com/api/v1/market?game=Pokemon")
            if [ "$RAIL" != "402" ]; then FAIL="x402 rail: /api/v1/market returned $RAIL (expected 402)"; fi
          fi

          # alert + fail (GitHub also emails the owner on a failed run)
          if [ -n "$FAIL" ]; then
            curl -sS \
              -H "Title: 🔴 Undesirables Oracle ALERT" \
              -H "Priority: urgent" -H "Tags: rotating_light" \
              -d "Oracle health check FAILED — $FAIL"$'\n'"$(date -u '+%Y-%m-%d %H:%M UTC')" \
              "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
            echo "::error::$FAIL"
            exit 1
          fi
          echo "✅ oracle healthy — $BODY"

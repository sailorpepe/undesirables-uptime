name: Oracle Uptime Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping oracle - status, freshness, x402 rail
        env:
          NTFY_TOPIC: undsr-oracle-watch-4441
        shell: bash
        run: |
          set +e
          FAIL=""

          RESP=$(curl -sS --max-time 25 --retry 2 -w "\n%{http_code}" https://oracle.the-undesirables.com/health)
          CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          [ "$CODE" != "200" ] && FAIL="/health returned HTTP $CODE"

          if [ -z "$FAIL" ]; then
            MSG=$(BODY="$BODY" python3 <<'PY'
import os, json, datetime
try:
    d = json.loads(os.environ["BODY"])
except Exception as e:
    print(f"/health not JSON: {e}"); raise SystemExit
if d.get("status") != "ok":
    print(f"status={d.get('status')!r}"); raise SystemExit
ld = d.get("latest_date")
try:
    days = (datetime.date.today() - datetime.date.fromisoformat(ld)).days
    if days > 2:
        print(f"pipeline stale: latest_date={ld} ({days}d old)")
except Exception as e:
    print(f"bad latest_date {ld!r}: {e}")
PY
)
            [ -n "$MSG" ] && FAIL="$MSG"
          fi

          if [ -z "$FAIL" ]; then
            RAIL=$(curl -sS --max-time 25 -o /dev/null -w "%{http_code}" "https://oracle.the-undesirables.com/api/v1/market?game=Pokemon")
            [ "$RAIL" != "402" ] && FAIL="x402 rail: /api/v1/market -> $RAIL (want 402)"
          fi

          if [ -n "$FAIL" ]; then
            curl -sS -H "Title: Undesirables Oracle ALERT" -H "Priority: urgent" -H "Tags: rotating_light" \
              -d "Oracle check FAILED: $FAIL ($(date -u '+%F %H:%M UTC'))" \
              "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
            echo "::error::$FAIL"
            exit 1
          fi
          echo "oracle healthy: $BODY"
